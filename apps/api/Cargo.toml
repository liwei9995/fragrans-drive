[package]
name = "fragrans"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mongodb = "3.5"
bson = { version = "2.9", features = ["chrono-0_4"] }
jsonwebtoken = "9.3"
image = "0.25"
dotenvy = "0.15"
config = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bcrypt = "0.15"
md-5 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "limit"] }
futures = "0.3"
futures-util = "0.3"
bytes = "1.5"
aes = "0.8"
ctr = "0.9"
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
utoipa = { version = "5.4", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9.0", features = ["axum"] }
utoipa-axum = "0.2"
thiserror = "2.0.19"
uuid = { version = "1.24.0", features = ["v4"] }
tempfile = "3.13"
regex = "1"

[dev-dependencies]
assert_cmd = "2.2.2"
http-body-util = "0.1"
serial_test = "3.2"
