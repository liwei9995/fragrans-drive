version: 2.1

jobs:
  build-and-deploy:
    # Use standard linux machine image with Docker pre-installed
    docker:
      - image: cimg/base:current
    steps:
      - checkout

      # Enable remote Docker environment for image builds
      - setup_remote_docker:
          version: default

      # 1. Log in to Aliyun ACR, then build and push images
      - run:
          name: Build and Push Docker Images
          command: |
            echo "Logging into Aliyun ACR..."
            docker login --username "$ALIYUN_REGISTRY_USER" --password "$ALIYUN_REGISTRY_PASSWORD" "$ALIYUN_REGISTRY_URL"

            # Calculate version tags
            TIMESTAMP=$(date +%Y%m%d%H%M)
            SHORT_SHA=$(echo $CIRCLE_SHA1 | cut -c1-8)
            UNIQUE_TAG="prod-${TIMESTAMP}-${SHORT_SHA}"

            # Extract version from package.json
            APP_VERSION=$(grep -o '"version": "[^"]*"' package.json | head -n 1 | cut -d'"' -f4)
            SEMVER_TAG="v${APP_VERSION}"
            LATEST_TAG="prod-latest"

            BUILD_ARGS="--build-arg VERSION=${APP_VERSION} --build-arg GIT_REVISION=${CIRCLE_SHA1}"

            echo "Building Web Image..."
            WEB_IMAGE="${ALIYUN_REGISTRY_URL}/fragrans-web"
            docker build -f apps/web/Dockerfile $BUILD_ARGS -t ${WEB_IMAGE}:${UNIQUE_TAG} .
            docker tag ${WEB_IMAGE}:${UNIQUE_TAG} ${WEB_IMAGE}:${SEMVER_TAG}
            docker tag ${WEB_IMAGE}:${UNIQUE_TAG} ${WEB_IMAGE}:${LATEST_TAG}
            docker push ${WEB_IMAGE}:${UNIQUE_TAG}
            docker push ${WEB_IMAGE}:${SEMVER_TAG}
            docker push ${WEB_IMAGE}:${LATEST_TAG}

            echo "Building API Image..."
            API_IMAGE="${ALIYUN_REGISTRY_URL}/fragrans-api"
            docker build -f apps/api/Dockerfile $BUILD_ARGS -t ${API_IMAGE}:${UNIQUE_TAG} apps/api
            docker tag ${API_IMAGE}:${UNIQUE_TAG} ${API_IMAGE}:${SEMVER_TAG}
            docker tag ${API_IMAGE}:${UNIQUE_TAG} ${API_IMAGE}:${LATEST_TAG}
            docker push ${API_IMAGE}:${UNIQUE_TAG}
            docker push ${API_IMAGE}:${SEMVER_TAG}
            docker push ${API_IMAGE}:${LATEST_TAG}

            # Write UNIQUE_TAG to BASH_ENV for subsequent steps
            echo "export UNIQUE_TAG=${UNIQUE_TAG}" >> $BASH_ENV

      # 2. Setup SSH key to connect to Aliyun server
      - run:
          name: Add Aliyun Host to known_hosts and Setup SSH Key
          command: |
            mkdir -p ~/.ssh
            echo "$ALIYUN_SSH_KEY_B64" | tr -d ' ' | base64 -d -i > ~/.ssh/aliyun_ed25519
            chmod 600 ~/.ssh/aliyun_ed25519
            ssh-keyscan -H $ALIYUN_HOST >> ~/.ssh/known_hosts

      # 3. Generate .env and deploy configuration to Aliyun
      - run:
          name: Deploy to Aliyun
          command: |
            echo "Generating .env file from CircleCI environment variables..."
            # Inject environment variables into .env, including UNIQUE_TAG
            cat \<<EOF > .env
            COMPOSE_PROJECT_NAME=ci-yi-svc-storage
            MONGO_INITDB_ROOT_USERNAME=$MONGO_INITDB_ROOT_USERNAME
            MONGO_INITDB_ROOT_PASSWORD=$MONGO_INITDB_ROOT_PASSWORD
            MONGO_EXPRESS_USERNAME=$MONGO_EXPRESS_USERNAME
            MONGO_EXPRESS_PASSWORD=$MONGO_EXPRESS_PASSWORD
            JWT_SECRET_KEY=$JWT_SECRET_KEY
            STORAGE_MASTER_KEY_HEX=$STORAGE_MASTER_KEY_HEX
            DRIVE_DOMAIN=$DRIVE_DOMAIN
            ALIYUN_REGISTRY_URL=$ALIYUN_REGISTRY_URL
            IMAGE_TAG=$UNIQUE_TAG
            ALLOW_REGISTRATION=$ALLOW_REGISTRATION
            CAPTCHA_REQUIRED=$CAPTCHA_REQUIRED
            EMAIL_VERIFICATION_REQUIRED=$EMAIL_VERIFICATION_REQUIRED
            SMTP_HOST=$SMTP_HOST
            SMTP_PORT=$SMTP_PORT
            SMTP_USER=$SMTP_USER
            SMTP_PASS=$SMTP_PASS
            SMTP_FROM=$SMTP_FROM
            EOF

            echo "Deploying config files to Aliyun..."
            SSH_OPTS="-i ~/.ssh/aliyun_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o BatchMode=yes"
            ssh $SSH_OPTS $ALIYUN_USER@$ALIYUN_HOST "mkdir -p $ALIYUN_DEPLOY_PATH"

            # Only upload docker-compose.yaml and .env without source code
            scp $SSH_OPTS docker-compose.yaml .env $ALIYUN_USER@$ALIYUN_HOST:$ALIYUN_DEPLOY_PATH/

            # Login to ACR on remote host -> pull latest images -> start services -> prune dangling images
            ssh $SSH_OPTS $ALIYUN_USER@$ALIYUN_HOST "cd $ALIYUN_DEPLOY_PATH && \
              docker login --username '$ALIYUN_REGISTRY_USER' --password '$ALIYUN_REGISTRY_PASSWORD' '$ALIYUN_REGISTRY_URL' && \
              docker-compose pull && \
              docker-compose up -d --remove-orphans && \
              docker image prune -f"

workflows:
  version: 2
  build-deploy-pipeline:
    jobs:
      - build-and-deploy:
          filters:
            branches:
              # Trigger deployment on main and feat/monorepo branches
              only: 
                - main
                - feat/monorepo
