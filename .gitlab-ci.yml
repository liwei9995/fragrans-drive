stages:
  - verify

verify:
  stage: verify
  image: node:24-alpine
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  script:
    - pnpm install --frozen-lockfile
    - pnpm verify
